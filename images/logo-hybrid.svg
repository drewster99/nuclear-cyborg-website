<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Hexagon (representing containment/simplicity) -->
    <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" 
          stroke="url(#gradient1)" 
          stroke-width="1.5"
          fill="none">
        <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Inner Structure (representing organized complexity) -->
    <path d="M24 12L36 19V29L24 36L12 29V19L24 12Z" 
          stroke="url(#gradient2)" 
          stroke-width="1"
          fill="none"/>
    
    <!-- Central Core -->
    <circle cx="24" cy="24" r="4" fill="url(#gradient3)">
        <animate attributeName="r" values="4;4.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Orbital Rings (representing dynamic systems) -->
    <circle cx="24" cy="24" r="8" stroke="url(#gradient1)" stroke-width="0.5" stroke-dasharray="2 2">
        <animateTransform attributeName="transform" 
                          type="rotate"
                          from="0 24 24"
                          to="360 24 24"
                          dur="8s"
                          repeatCount="indefinite"/>
    </circle>
    
    <!-- Connection Points -->
    <circle cx="18" cy="19" r="1.5" fill="url(#gradient4)"/>
    <circle cx="30" cy="19" r="1.5" fill="url(#gradient4)"/>
    <circle cx="18" cy="29" r="1.5" fill="url(#gradient4)"/>
    <circle cx="30" cy="29" r="1.5" fill="url(#gradient4)"/>
    
    <!-- Dynamic Connection Lines -->
    <path d="M18 19L30 19M18 29L30 29M18 19L18 29M30 19L30 29" 
          stroke="url(#gradient2)" 
          stroke-width="0.75" 
          stroke-dasharray="1 1">
        <animate attributeName="stroke-dashoffset" values="0;-4" dur="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- Pulse Effect -->
    <circle cx="24" cy="24" r="12" stroke="url(#gradient1)" stroke-width="0.5" opacity="0.3">
        <animate attributeName="r" values="12;14;12" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <defs>
        <linearGradient id="gradient1" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00ff9d"/>
            <stop offset="100%" stop-color="#3d5afe"/>
        </linearGradient>
        <linearGradient id="gradient2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00ff9d"/>
            <stop offset="100%" stop-color="#3d5afe"/>
        </linearGradient>
        <radialGradient id="gradient3" cx="24" cy="24" r="4" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00ff9d"/>
            <stop offset="80%" stop-color="#3d5afe"/>
        </radialGradient>
        <radialGradient id="gradient4" cx="0" cy="0" r="1.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00ff9d"/>
            <stop offset="100%" stop-color="#3d5afe"/>
        </radialGradient>
    </defs>
</svg> 