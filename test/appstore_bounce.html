<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="google-adsense-account" content="ca-pub-3322174655633417">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3322174655633417" crossorigin="anonymous"></script>
<script>
function getOS() {
    let enableBounce = true;

    let userAgent = navigator.userAgent || navigator.vendor || window.opera;
    let plat = navigator.platform;
    console.log("getOS: User agent: " + userAgent);

    var os = "other";
    if (/windows phone/i.test(userAgent)) {
        // 
    } else if (/android/i.test(userAgent)) {
        os = "Android";
    } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        // iOS detection from: http://stackoverflow.com/a/9039885/177710
        os = "iOS";
    } else if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
        // Try to differentiate between macOS and iPadOS
        // https://stackoverflow.com/questions/9038625/detect-if-device-is-ios/9039885
        os = "iPadOS"
    } else if (typeof navigator.standalone === 'boolean') {
        // MacOS and iPadOS userAgents are identical, but this flag is only available on
        // iOS and iPadOS.
        // https://stackoverflow.com/questions/9038625/detect-if-device-is-ios/9039885#9039885
        os = "iPadOS";
    }
    console.log("getOS: OS detected: " + os);
    return os;
}

function BounceToAppStore() {
    let os = getOS();
    if (os == "Android") {
        window.location.href = "https://play.google.com/store/apps/details?id=org.clevelandart.artlens"; 
    } else if (os == "iOS" || os == "iPadOS") {
        window.location.href = "https://apps.apple.com/us/app/artlens/id580839935";
    } else {
        window.location.href = "https://www.clevelandart.org/";
    }
    
}

function fireDeepLink() {
    let os = getOS();
    if (os == "iOS" || os == "iPadOS") {
        console.log("fireDeepLink: Opening deep link");
        console.log("fireDeepLink: href before changing = " + window.location.href);
        window.location = "artlens://exhibition/sfs";
        console.log("fireDeepLink: href = " + window.location.href);
        for (let i = 0; i < 60; i++) {
            setTimeout(function () {
                console.log("timer " + (i * 1000) + "ms: href = " + window.location.href);
            }
                , i * 1000);
        }
    } else if (os == "Android") {
        console.log("fireDeepLink: Opening deep link");
        console.log("fireDeepLink: href before changing = " + window.location.href);
        window.location = "artlens://exhibition/sfs";
        console.log("fireDeepLink: href = " + window.location.href);
        for (let i = 0; i < 60; i++) {
            setTimeout(function () {
                console.log("timer " + (i * 1000) + "ms: href = " + window.location.href);
            }
                , i * 1000);
        }
        setTimeout(function () {
                console.log("timer yeah 3000 href = " + window.location.href);
                console.log("try to go to store...");
                BounceToAppStore();
            }
                , 3000);
    }
}

function showInfo() {
    document.body.innerHTML = "<H1>User Agent</H1>\n<P>" + userAgent + "</P>\n" + "<H1>OS Detected</H1>\n<P>" + os + "</P>\n"; 
}
</script>
</head>
<body onload="showInfo()">
</body>
</html>
